<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>My Todo list</title>
		<link rel="stylesheet" href="style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
	</head>
	<body>
		<main>
			<h1>Todo List</h1>

			<form class="action">
				<input id="todo-name" type="search" name="todo-name" placeholder="What needs to be done?"/>
				<input id="todo-hours" type="number" name="todo-hours" value="0">
				<button type="submit">Add</button>
			</form>

			<div class="filters">
				<div>
					<input id="all" type="radio" name="filter" value="All">
					<label for="all">All</label>
					<input id="active" type="radio" name="filter" value="Active">
					<label for="active">Active</label>
					<input id="completed" type="radio" name="filter" value="Completed">
					<label for="completed">Completed</label>
				</div>
				<button>Mark all done</button>
			</div>

			<section class="tasks">

				<div class="task">
					<span>
						<input id="taskid0" type="checkbox" name="taskid0" value="taskid0">
						<label for="taskid0" class="task-name">Reply emails</label>
					</span>
					<span>
						<span class="badge">Easy &#x2022; 1h</span>
						<button class="remove-task">x</button>
					</span>
				</div>
				<hr>

				<div class="task">
					<span>
						<input id="taskid1" type="checkbox" name="taskid1" value="taskid1">
						<label for="taskid1" class="task-name">Fix login bug</label>
					</span>
					<span>
						<span class="badge-medium">Medium &#x2022; 4h</span>
						<button class="remove-task">x</button>
					</span>
				</div>
				<hr>

				<div class="task">
					<span>
						<input checked id="taskid2" type="checkbox" name="taskid2" value="taskid2">
						<label for="taskid2" class="task-name"><strike>Build reports page</strike></label>
					</span>
					<span>
						<span class="badge-hard">Hard &#x2022; 6h</span>
						<button class="remove-task">x</button>
					</span>
				</div>
				<hr>

			</section>

			<div class="item-count">
				<span>3 items left &#x2022; 11 hours total</span>
				<button>Clear completed</button>
			</div>

			<div class="footer">
				<div>Easy: up to 2h &#x2022; Medium: over 2h &#x2022; Hard: over 5h.</div>
				<div>Double-click a task or its label to edit the text or hours. Press enter to save, Esc to cancel.</div>
			</div>

		</main>
	</body>
</html>
